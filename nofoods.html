<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jen's NO Foods List</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff6f6;color:#1a1a1a;margin:0;padding:24px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#666;font-size:13px;margin-bottom:20px;}
  .item{background:#fff;border:1px solid #f0d6d6;border-left:4px solid #d33;border-radius:10px;padding:12px 16px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .food{font-size:17px;font-weight:700;}
  .reason{font-size:14px;color:#555;margin-top:3px;white-space:pre-wrap;}
  .empty{color:#888;font-style:italic;}
</style>
</head>
<body>
  <h1>🚫 Jen's NO Foods List</h1>
  <div class="sub">Foods to avoid. Added when you tell ClaudeBot. Newest first.</div>
  <div id="list"><div class="empty">Loading…</div></div>
<script>
fetch('./nofoods.json?_=' + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(data => {
    var el = document.getElementById('list');
    if (!data || !data.length) { el.innerHTML = '<div class="empty">No items yet.</div>'; return; }
    el.innerHTML = data.map(function(e){
      return '<div class="item"><div class="food">' +
        String(e.food||'').replace(/</g,'&lt;') + '</div>' +
        (e.reason ? '<div class="reason">' + String(e.reason).replace(/</g,'&lt;') + '</div>' : '') +
        '</div>';
    }).join('');
  })
  .catch(function(){ document.getElementById('list').innerHTML = '<div class="empty">Could not load list.</div>'; });
</script>
</body>
</html>
