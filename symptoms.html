<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jen's Health — Symptom & Data Log</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f8fa;color:#1a1a1a;margin:0;padding:24px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#666;font-size:13px;margin-bottom:20px;}
  .entry{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px 16px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .time{color:#0a7d3c;font-size:12px;font-weight:600;letter-spacing:.02em;}
  .text{font-size:16px;margin-top:4px;white-space:pre-wrap;}
  .empty{color:#888;font-style:italic;}
</style>
</head>
<body>
  <h1>🩺 Jen's Health — Symptom &amp; Data Log</h1>
  <div class="sub">Logged automatically when you text ClaudeBot. Newest first.</div>
  <div id="log"><div class="empty">Loading…</div></div>
<script>
fetch('./symptoms.json?_=' + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(data => {
    var el = document.getElementById('log');
    if (!data || !data.length) { el.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
    el.innerHTML = data.map(function(e){
      return '<div class="entry"><div class="time">' +
        (e.time||'') + '</div><div class="text">' +
        String(e.entry||'').replace(/</g,'&lt;') + '</div></div>';
    }).join('');
  })
  .catch(function(){ document.getElementById('log').innerHTML = '<div class="empty">Could not load log.</div>'; });
</script>
</body>
</html>
